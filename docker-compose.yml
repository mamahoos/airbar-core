# Base stack — shared service definitions for all environments.
# Use with an overlay:
#   dev:     docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   staging: IMAGE_TAG=ghcr.io/... docker compose -f docker-compose.staging.yml up -d
#            (server: /srv/airbar.app/airbar-core/, shared airbar-net)
#   prod:    IMAGE_TAG=ghcr.io/... docker compose -f docker-compose.prod.yml up -d

name: ${COMPOSE_PROJECT_NAME:-airbar-core}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-airbar_api}
      POSTGRES_USER: ${DB_USER:-airbar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-airbar_secret}
    volumes:
      - airbar_core_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', '${DB_USER:-airbar}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - airbar_core_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  app:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${DB_USER:-airbar}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-airbar_api}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  airbar_core_pg:
  airbar_core_redis:
