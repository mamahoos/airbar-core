# Resources only — postgres + redis for local development (no app container).
# Run `npm run dev` on the host, or use docker-compose.dev.yml for the full stack.
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.resources.yml up -d

services:
  postgres:
    container_name: airbar-core-postgres-dev
    ports:
      - '${DB_PORT:-5435}:5432'

  redis:
    container_name: airbar-core-redis-dev
    ports:
      - '${REDIS_PORT:-6382}:6379'
